# HAProxy is the only entry point to the silver and gold PostgreSQL clusters.
#
# Mode A (pinned failover): every application connection goes to node 1 while
# it is healthy; node 2 is a hot backup and takes over when node 1 is down.
# Both nodes accept writes and Spock replicates bidirectionally, but pinning
# batch writers avoids concurrent DDL/DML on the same table.
#
# Read-only frontends round-robin across both nodes for Trino and monitoring.

global
    maxconn 512
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option tcpka
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 2
    option redispatch
    default-server inter 2s fastinter 1s downinter 5s fall 3 rise 2

# --- Silver ---------------------------------------------------------------

frontend silver_rw
    bind *:5433
    default_backend silver_rw_backend

backend silver_rw_backend
    balance first
    server spock-silver-1 spock-silver-1:5432 check
    server spock-silver-2 spock-silver-2:5432 check backup

frontend silver_ro
    bind *:5435
    default_backend silver_ro_backend

backend silver_ro_backend
    balance roundrobin
    server spock-silver-1 spock-silver-1:5432 check
    server spock-silver-2 spock-silver-2:5432 check

# --- Gold -----------------------------------------------------------------

frontend gold_rw
    bind *:5434
    default_backend gold_rw_backend

backend gold_rw_backend
    balance first
    server spock-gold-1 spock-gold-1:5432 check
    server spock-gold-2 spock-gold-2:5432 check backup

frontend gold_ro
    bind *:5436
    default_backend gold_ro_backend

backend gold_ro_backend
    balance roundrobin
    server spock-gold-1 spock-gold-1:5432 check
    server spock-gold-2 spock-gold-2:5432 check

# --- Observability --------------------------------------------------------

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
