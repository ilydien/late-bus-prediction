# Debezium Server: silver layer of the `wmata` database -> NATS JetStream.
#
# Debezium emits "<topic.prefix>.<schema>.<table>", i.e.
# wmata.realtime.silver_data.public.<table>, plus schema-change events at the
# bare prefix. The `wmata-silver` stream (created by nats-init) owns retention,
# so Debezium must not create a stream of its own.

debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=false
debezium.sink.nats-jetstream.subjects=wmata.realtime.silver_data,wmata.realtime.silver_data.>
debezium.sink.nats-jetstream.storage=file

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=haproxy
debezium.source.database.port=5433
debezium.source.database.user=${POSTGRES_SILVER_USER}
debezium.source.database.password=${POSTGRES_SILVER_PASSWORD}
debezium.source.database.dbname=${POSTGRES_DB_WMATA}
debezium.source.topic.prefix=wmata.realtime.silver_data
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=wmata_silver
debezium.source.publication.name=wmata_silver_pub
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=public
# Placeholder until the silver tables are named:
# debezium.source.table.include.list=public.<table>
debezium.source.decimal.handling.mode=string
