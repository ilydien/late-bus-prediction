global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
        labels:
          component: streaming

  - job_name: postgres-infra
    static_configs:
      - targets: ["postgres-exporter-infra:9187"]
        labels:
          layer: infra

  - job_name: postgres-silver
    static_configs:
      - targets: ["postgres-exporter-silver:9187"]
        labels:
          layer: silver

  - job_name: postgres-gold
    static_configs:
      - targets: ["postgres-exporter-gold:9187"]
        labels:
          layer: gold

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy:8404"]
        labels:
          component: proxy

  - job_name: health-monitor
    static_configs:
      - targets: ["monitor:8090"]
        labels:
          component: monitor

  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]
        labels:
          component: alerting
