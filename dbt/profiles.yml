wmata_postgres:
  target: silver_wmata
  outputs:
    silver_wmata:
      type: postgres
      threads: 4
      host: "{{ env_var('POSTGRES_SILVER_HOST', 'haproxy') }}"
      port: "{{ env_var('POSTGRES_SILVER_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_SILVER_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_SILVER_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB_WMATA', 'wmata') }}"
      schema: public

    gold_wmata:
      type: postgres
      threads: 4
      host: "{{ env_var('POSTGRES_GOLD_HOST', 'haproxy') }}"
      port: "{{ env_var('POSTGRES_GOLD_PORT', '5434') | int }}"
      user: "{{ env_var('POSTGRES_GOLD_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_GOLD_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB_WMATA', 'wmata') }}"
      schema: public

    silver_traffic:
      type: postgres
      threads: 4
      host: "{{ env_var('POSTGRES_SILVER_HOST', 'haproxy') }}"
      port: "{{ env_var('POSTGRES_SILVER_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_SILVER_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_SILVER_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB_TRAFFIC', 'traffic') }}"
      schema: public

    gold_traffic:
      type: postgres
      threads: 4
      host: "{{ env_var('POSTGRES_GOLD_HOST', 'haproxy') }}"
      port: "{{ env_var('POSTGRES_GOLD_PORT', '5434') | int }}"
      user: "{{ env_var('POSTGRES_GOLD_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_GOLD_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB_TRAFFIC', 'traffic') }}"
      schema: public
