name: wmata-lateness

x-logging: &default-logging
  logging:
    driver: json-file

x-spark: &spark-image
  build:
    context: ./spark
    dockerfile: Containerfile

services:
  postgres-silver:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-silver:/var/lib/postgresql
      - ./configs/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_SILVER_HOST_PORT:-5433}:5432
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_SILVER_USER:-postgres} -d
          ${POSTGRES_DB_WMATA:-wmata} && pg_isready -U
          ${POSTGRES_SILVER_USER:-postgres} -d ${POSTGRES_DB_TRAFFIC:-traffic}"
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  postgres-gold:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-gold:/var/lib/postgresql
      - ./configs/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_GOLD_HOST_PORT:-5434}:5432
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_GOLD_USER:-postgres} -d
          ${POSTGRES_DB_WMATA:-wmata} && pg_isready -U
          ${POSTGRES_GOLD_USER:-postgres} -d ${POSTGRES_DB_TRAFFIC:-traffic}"
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  postgres-infra:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_INFRA:-infra}
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-infra:/var/lib/postgresql
      - ./configs/postgres/init-dbs-infra.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_INFRA_HOST_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_INFRA_USER:-postgres} -d
            ${POSTGRES_DB_INFRA:-infra}",
        ]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  seaweedfs:
    <<: *default-logging
    image: docker.io/chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - ${HOST_IP:-127.0.0.1}:8333:8333
      - ${HOST_IP:-127.0.0.1}:8888:8888
    volumes:
      - ./storage/seaweedfs:/data
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - ./configs/seaweedfs/notification.toml:/etc/seaweedfs/notification.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - devnet
    profiles: ["dev"]

  seaweedfs-init:
    image: docker.io/chrislusf/seaweedfs:4.53
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://seaweedfs:9333/cluster/status >/dev/null 2>&1; do sleep 1; done
        sleep 5
        for bucket in wmata traffic mlflow; do
          echo "s3.bucket.create -name $${bucket} -owner $${bucket%}" \
            | /usr/bin/weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 || true
        done
        echo "SeaweedFS buckets ready"
    depends_on:
      seaweedfs:
        condition: service_started
    networks:
      - devnet
    profiles: ["dev"]

  seaweedfs-bridge:
    <<: *default-logging
    build:
      context: ./seaweedfs/bridge
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      BRIDGE_PORT: "8080"
    ports:
      - ${HOST_IP:-127.0.0.1}:8081:8080
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - devnet
    profiles: ["dev"]

  victoriametrics:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:8428:8428
    environment:
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}

    volumes:
      - ./storage/victoriametrics:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION:-3M}"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=10s"
      - "-search.maxQueryDuration=30s"
      - "-memory.allowedPercent=60"
      - "-storage.minFreeDiskSpaceBytes=1GB"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8428/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - devnet
    profiles: ["dev"]

  victorialogs:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:9428:9428
    volumes:
      - ./storage/victorialogs:/vlogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${VL_RETENTION:-3M}"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - devnet
    profiles: ["dev"]

  vector:
    <<: *default-logging
    image: docker.io/timberio/vector:0.60.0-alpine
    restart: unless-stopped
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      victorialogs:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  nats:
    <<: *default-logging
    image: docker.io/nats:2.15.2-alpine3.22
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:4222:4222
      - ${HOST_IP:-127.0.0.1}:8222:8222
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - ./storage/nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devnet
    profiles: ["dev"]

  nats-init:
    image: docker.io/natsio/nats-box:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Waiting for NATS..."
        until nc -z nats 4222; do sleep 1; done
        echo "Creating bronze/silver/inference streams..."
        create_stream() {
          name="$1"; subjects="$2"; max_age="$3"; max_bytes="$4"
          nats -s nats:4222 stream info "$name" >/dev/null 2>&1 || \
            nats -s nats:4222 stream add "$name" \
              --subjects "$subjects" --storage file --retention limits \
              --discard old --max-msgs=-1 --max-bytes="$max_bytes" \
              --max-age "$max_age" --dupe-window 2m
        }
        create_stream wmata-bronze    "wmata.realtime.bronze_data,wmata.realtime.bronze_data.>"       3d 2GB
        create_stream traffic-bronze  "traffic.realtime.bronze_data,traffic.realtime.bronze_data.>"   3d 2GB
        create_stream wmata-silver    "wmata.realtime.silver_data,wmata.realtime.silver_data.>"      7d 5GB
        create_stream traffic-silver  "traffic.realtime.silver_data,traffic.realtime.silver_data.>"  7d 5GB
        create_stream wmata-inference "wmata.realtime.inference,wmata.realtime.inference.>"          7d 1GB
        echo "NATS init complete"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  nats-nui:
    image: ghcr.io/nats-nui/nui:0.10
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:31311:31311
    volumes:
      - ./storage/nui:/db
      - ./configs/nui/contexts:/nui-contexts:ro
    command: ["--nats-cli-contexts=/nui-contexts"]
    depends_on:
      nats:
        condition: service_started
    networks:
      - devnet
    profiles: ["dev"]

  debezium-wmata:
    <<: *default-logging
    image: docker.io/debezium/server:3.0.0.Final
    restart: unless-stopped
    user: "0"
    env_file:
      - .env
    volumes:
      - ./configs/debezium/wmata.properties:/debezium/config/application.properties:ro
      - ./storage/debezium/wmata:/debezium/data
    depends_on:
      postgres-silver:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - devnet
    profiles: ["dev"]

  debezium-traffic:
    <<: *default-logging
    image: docker.io/debezium/server:3.0.0.Final
    restart: unless-stopped
    user: "0"
    env_file:
      - .env
    volumes:
      - ./configs/debezium/traffic.properties:/debezium/config/application.properties:ro
      - ./storage/debezium/traffic:/debezium/data
    depends_on:
      postgres-silver:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - devnet
    profiles: ["dev"]

  dagster-user-code:
    <<: *default-logging
    build:
      context: .
      dockerfile: dagster/etl/Containerfile
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DLT_PROJECT_DIR: /opt/dagster/dlt
    env_file:
      - .env
    volumes:
      - ./dagster:/opt/dagster/app
      - ./dlt:/opt/dagster/dlt
      - ./dbt:/opt/dagster/dbt
      - ./gx_quality:/opt/dagster/app/gx_quality
      - ./shared:/opt/dagster/app/shared:ro
    depends_on:
      postgres-infra:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(5);
            s.connect(('127.0.0.1',4000)); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - devnet
    profiles: ["dev"]

  dagster-webserver:
    <<: *default-logging
    build:
      context: .
      dockerfile: ./dagster/daemon/Containerfile
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:3000:3000
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
            urllib.request.urlopen('http://localhost:3000/dagit_info')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  dagster-daemon:
    <<: *default-logging
    build:
      context: .
      dockerfile: ./dagster/daemon/Containerfile
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
    entrypoint:
      - dagster-daemon
      - run
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; c=open('/proc/1/cmdline').read(); exit(0 if
            'dagster-daemon' in c else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  mlflow:
    <<: *default-logging
    build:
      context: .
      dockerfile: configs/mlflow/Containerfile
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:5000:5000
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_INFRA_USER:-postgres}:${POSTGRES_INFRA_PASSWORD:-postgres}@postgres-infra:${POSTGRES_INFRA_PORT:-5432}/mlflow_db
      MLFLOW_S3_ENDPOINT_URL: ${SEAWEEDFS_S3_ENDPOINT:-http://seaweedfs:8333}
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MLFLOW_KEY_ID:-mlflow-key-id}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_SECRET_KEY:-mlflow-secret-key}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      MLFLOW_ALLOWED_HOSTS: "*"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; assert
            urllib.request.urlopen('http://localhost:5000/health').status ==
            200",
        ]
      interval: 30s
      timeout: 10s
      retries: 3000
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    networks:
      - devnet
    profiles: ["dev"]

  # inference:
  #   <<: *default-logging
  #   build:
  #     context: .
  #     dockerfile: inference/Containerfile
  #   restart: unless-stopped
  #   environment:
  #     MLFLOW_TRACKING_URI: http://mlflow:5000
  #     MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
  #     AWS_ACCESS_KEY_ID: mlflow-key-id
  #     AWS_SECRET_ACCESS_KEY: mlflow-secret-key
  #     AWS_DEFAULT_REGION: us-east-1
  #     AWS_S3_FORCE_PATH_STYLE: "true"
  #     PG_HOST: postgres-infra
  #     PG_PORT: 5432
  #     PG_USER: ${POSTGRES_INFRA_USER:-postgres}
  #     PG_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
  #     PG_DB: ${POSTGRES_INFRA_DB:-electricity}
  #     NATS_URL: nats://nats:4222
  #     NATS_SUBJECT: electricity.silver.demand_5min
  #     TELEGRAM_BOT_API_KEY: ${TELEGRAM_BOT_API_KEY:-}
  #     TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  #   depends_on:
  #     debezium-server:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     mlflow:
  #       condition: service_healthy
  #     nats:
  #       condition: service_started
  #     nats-init:
  #       condition: service_completed_successfully
  #   networks:
  #     - devnet
  #   profiles: ["dev"]

  dbt:
    <<: *default-logging
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    restart: "no"
    environment:
      DBT_PROFILES_DIR: /usr/app
    env_file:
      - .env
    depends_on:
      postgres-silver:
        condition: service_healthy
    volumes:
      - ./dbt:/usr/app
    entrypoint: ["dbt"]
    working_dir: /usr/app
    networks:
      - devnet
    profiles: ["dev"]

  dlt:
    <<: *default-logging
    build:
      context: ./dlt
      dockerfile: Containerfile
    restart: "no"
    environment:
      POSTGRES_INFRA_USER: ${POSTGRES_INFRA_USER:-postgres-infra}
      POSTGRES_INFRA_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres-infra}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres-infra}
    volumes:
      - ./dlt:/app
      - ./shared:/app/shared:ro
    working_dir: /app
    networks:
      - devnet
    profiles: ["dev"]

  trino:
    <<: *default-logging
    image: docker.io/trinodb/trino:484
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:8080:8080
    environment:
      POSTGRES_SILVER_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_SILVER_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      POSTGRES_GOLD_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_GOLD_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
    volumes:
      - ./configs/trino:/etc/trino:ro
    depends_on:
      postgres-silver:
        condition: service_healthy
      postgres-gold:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - devnet
    profiles: ["dev"]

  # Standalone Spark cluster. All three services share one image (x-spark) with
  # the S3A + PostgreSQL JDBC jars baked in.
  spark-master:
    <<: [*default-logging, *spark-image]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --webui-port
      - "8080"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - ${HOST_IP:-127.0.0.1}:7077:7077
      - ${HOST_IP:-127.0.0.1}:8082:8080
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      # The official image has no curl, so probe the UI port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - devnet
    profiles: ["dev"]

  spark-worker:
    <<: [*default-logging, *spark-image]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 2g
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - ${HOST_IP:-127.0.0.1}:8083:8081
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - devnet
    profiles: ["dev"]

  # One-shot submitter. Example:
  #   docker compose -f compose.dev.yaml --profile dev run --rm spark-submit \
  #     --master spark://spark-master:7077 /opt/spark/jobs/bronze_check.py
  spark-submit:
    <<: [*default-logging, *spark-image]
    restart: "no"
    entrypoint: ["/opt/spark/bin/spark-submit"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      POSTGRES_SILVER_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_SILVER_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      SPARK_BRONZE_BUCKET: ${SEAWEEDFS_BUCKET_WMATA_BRONZE:-wmata}
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/jobs:/opt/spark/jobs:ro
    depends_on:
      spark-master:
        condition: service_healthy
      postgres-silver:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - devnet
    profiles: ["dev"]
