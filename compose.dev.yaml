name: wmata-lateness

x-logging: &default-logging
  logging:
    driver: json-file

services:
  postgres-silver:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-silver:/var/lib/postgresql
      - ./configs/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_SILVER_HOST_PORT:-5433}:5432
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_SILVER_USER:-postgres} -d
          ${POSTGRES_DB_WMATA:-wmata} && pg_isready -U
          ${POSTGRES_SILVER_USER:-postgres} -d ${POSTGRES_DB_TRAFFIC:-traffic}"
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  postgres-gold:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-gold:/var/lib/postgresql
      - ./configs/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_GOLD_HOST_PORT:-5434}:5432
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_GOLD_USER:-postgres} -d
          ${POSTGRES_DB_WMATA:-wmata} && pg_isready -U
          ${POSTGRES_GOLD_USER:-postgres} -d ${POSTGRES_DB_TRAFFIC:-traffic}"
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  postgres-infra:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_INFRA:-infra}
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-infra:/var/lib/postgresql
      - ./configs/postgres/init-dbs-infra.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_INFRA_HOST_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_INFRA_USER:-postgres} -d
            ${POSTGRES_DB_INFRA:-infra}",
        ]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - devnet
    profiles: ["dev"]

  garage:
    <<: *default-logging
    image: docker.io/dxflrs/garage:v2.3.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:3900:3900
      - ${HOST_IP:-127.0.0.1}:3902:3902
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-changeme}
      GARAGE_ADMIN_SECRET: ${GARAGE_ADMIN_TOKEN:-changeme}
      GARAGE_DEFAULT_BUCKET: mlflow
      GARAGE_DEFAULT_ACCESS_KEY: mlflow-key-id
      GARAGE_DEFAULT_SECRET_KEY: mlflow-secret-key
    volumes:
      - ./configs/garage/config.toml:/etc/garage.toml:ro
      - ./storage/garage:/var/lib/garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devnet
    profiles: ["dev"]

  garage-init:
    image: docker.io/curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ADMIN_TOKEN="${GARAGE_ADMIN_TOKEN:-changeme}"
        BASE="http://garage:3902"

        until curl -sf "$$BASE/health" >/dev/null 2>&1; do sleep 2; done

        create_bucket() {
          name="$$1"
          key_id="$$2"
          secret="$$3"
          key_name="$$4"

          BUCKET_JSON="$$(curl -sf -X POST "$$BASE/v1/bucket" \
            -H "Authorization: Bearer $$ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"globalAlias\":\"$$name\"}")"
          BUCKET_ID="$$(echo "$$BUCKET_JSON" | awk -F'"' '/"id"/{print $$4}')"

          curl -sf -X POST "$$BASE/v1/key" \
            -H "Authorization: Bearer $$ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$$key_id\",\"secretKey\":\"$$secret\",\"name\":\"$$key_name\"}" >/dev/null

          [ -n "$$BUCKET_ID" ] && \
          curl -sf -X PUT "$$BASE/v1/bucket?id=$${BUCKET_ID}" \
            -H "Authorization: Bearer $$ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"keyId\":\"$$key_id\",\"permissions\":[\"read\",\"write\"]}" || true

          echo "Bucket ready: $$name (key=$$key_id)"
        }

        create_bucket "wmata"   "wmata-key-id"   "wmata-secret-key"   "wmata-key"
        create_bucket "traffic" "traffic-key-id" "traffic-secret-key" "traffic-key"
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-changeme}
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  victoriametrics:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:8428:8428
    environment:
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}

    volumes:
      - ./storage/victoriametrics:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION:-3M}"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=10s"
      - "-search.maxQueryDuration=30s"
      - "-memory.allowedPercent=60"
      - "-storage.minFreeDiskSpaceBytes=1GB"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8428/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - devnet
    profiles: ["dev"]

  victorialogs:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:9428:9428
    volumes:
      - ./storage/victorialogs:/vlogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${VL_RETENTION:-3M}"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - devnet
    profiles: ["dev"]

  vector:
    <<: *default-logging
    image: docker.io/timberio/vector:0.60.0-alpine
    restart: unless-stopped
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      victorialogs:
        condition: service_healthy
    networks:
      - devnet
    profiles: ["dev"]

  nats:
    <<: *default-logging
    image: docker.io/nats:2.15.2
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:4222:4222
      - ${HOST_IP:-127.0.0.1}:8222:8222
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "nats-server", "--check", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devnet
    profiles: ["dev"]

  nats-init:
    image: docker.io/natsio/nats-box:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Waiting for NATS..."
        until nc -z nats 4222; do sleep 1; done
        echo "Creating stream 'wmata' and 'traffic'..."
        create_stream() {
          name="$1"; subjects="$2"; max_age="$3"; max_bytes="$4"
          nats -s nats:4222 stream info "$name" >/dev/null 2>&1 || \
            nats -s nats:4222 stream add "$name" \
              --subjects "$subjects" --storage file --retention limits \
              --discard old --max-msgs=-1 --max-bytes="$max_bytes" \
              --max-age "$max_age" --dupe-window 2m
        }
        create_stream wmata-data      "wmata.realtime.data,wmata.realtime.data.>"           3d 2GB
        create_stream wmata-inference "wmata.realtime.inference,wmata.realtime.inference.>" 7d 1GB
        create_stream traffic-data    "traffic.realtime.data,traffic.realtime.data.>"       2d 2GB
        echo "NATS init complete"
    depends_on:
      nats:
        condition: service_started
    networks:
      - devnet
    profiles: ["dev"]

  nats-nui:
    image: ghcr.io/nats-nui/nui:0.10
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:31311:31311
    volumes:
      - ./storage/nui:/db
    depends_on:
      nats:
        condition: service_started
    networks:
      - devnet
    profiles: ["dev"]

