  dbt:
    <<: *default-logging
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    restart: "no"
    environment:
      DBT_PROFILES_DIR: /usr/app
    env_file:
      - .env
    depends_on:
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
    volumes:
      - ./dbt:/usr/app
    entrypoint: ["dbt"]
    working_dir: /usr/app
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  dlt:
    <<: *default-logging
    build:
      context: ./dlt
      dockerfile: Containerfile
    command: ["ingest_wmata_2020.py"]
    restart: "no"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      seaweedfs-bridge:
        condition: service_healthy
    environment:
      POSTGRES_INFRA_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_INFRA_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
    env_file:
      - .env
    volumes:
      - ./dlt:/app
      - ./shared:/app/shared:ro
      - dlt-state:/work
    working_dir: /app
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  trino:
    <<: *default-logging
    image: docker.io/trinodb/trino:484
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:8080:8080
    environment:
      POSTGRES_SILVER_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_SILVER_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      POSTGRES_GOLD_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_GOLD_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
    volumes:
      - ./configs/trino:/etc/trino:ro
    depends_on:
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
      spock-wire-gold:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spark-master:
    <<: [*default-logging, *spark-image]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --webui-port
      - "8080"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - ${HOST_IP:-127.0.0.1}:7077:7077
      - ${HOST_IP:-127.0.0.1}:8082:8080
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    healthcheck:
      # The official image has no curl, so probe the UI port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spark-worker:
    <<: [*default-logging, *spark-image]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 2g
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - ${HOST_IP:-127.0.0.1}:8083:8081
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spark-submit:
    <<: [*default-logging, *spark-image]
    restart: "no"
    entrypoint: ["/opt/spark/bin/spark-submit"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      POSTGRES_SILVER_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_SILVER_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      SPARK_BRONZE_BUCKET: ${SEAWEEDFS_BUCKET_WMATA_BRONZE:-wmata}
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/jobs:/opt/spark/jobs:ro
    depends_on:
      spark-master:
        condition: service_healthy
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  consumer:
    <<: *default-logging
    build:
      context: ./consumer
      dockerfile: Containerfile
    command: ["python3", "/app/bronze_consumer.py"]
    restart: unless-stopped
    stop_grace_period: 10m
    env_file:
      - .env
    environment:
      NATS_URL: nats://nats:4222
      SPARK_MASTER: spark://spark-master:7077
      SPARK_JOB: /opt/spark/jobs/bronze_to_silver.py
      SILVER_MERGE: /app/merge_silver.py
      CONSUMER_STATE: /work/consumer_state.json
      BRONZE_MANIFEST: /work/bronze_batch.json
      CONSUMER_HEARTBEAT: /work/consumer_heartbeat
      CONSUMER_POLL_INTERVAL: "5"
      CONSUMER_FETCH_TIMEOUT: "2"
      CONSUMER_ERROR_BACKOFF: "30"
      CONSUMER_BATCH_SIZE: "200"
      WMATA_BRONZE_PREFIXES: "bronze_"
      TRAFFIC_BRONZE_PREFIX: "ddot/"
      QUALITY_REPORT_DIR: /work/quality
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfs-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfs-secret-key}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./consumer:/app
      - ./quality:/app/quality:ro
      - ./governance:/app/governance:ro
      - ./.git:/app/.git:ro
      - ./spark/jobs:/opt/spark/jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - consumer-state:/work
      - ./quality/reports:/work/quality
    depends_on:
      nats-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os,time; p='/work/consumer_heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p)<1800\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

