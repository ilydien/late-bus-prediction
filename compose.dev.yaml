  serving-api:
    <<: *default-logging
    build:
      context: ./serving/api
      dockerfile: Containerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_GOLD_HOST: haproxy
      POSTGRES_GOLD_PORT: "5436"
      POSTGRES_GOLD_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_GOLD_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
      POSTGRES_DB_WMATA: ${POSTGRES_DB_WMATA:-wmata}
    ports:
      - ${HOST_IP:-127.0.0.1}:18000:8000
    depends_on:
      haproxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

