name: wmata-lateness

x-logging: &default-logging
  logging:
    driver: json-file

x-spark: &spark-image
  build:
    context: ./spark
    dockerfile: Containerfile

services:
  spock-silver-1:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_DB_TRAFFIC: ${POSTGRES_DB_TRAFFIC:-traffic}
      POSTGRES_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      PGEDGE_USER: ${PGEDGE_USER:-pgedge}
      PGEDGE_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
      NODE_NAME: silver1
      NODE_ORDINAL: "1"
    volumes:
      - spock-silver-1-data:/var/lib/pgsql
      - ./configs/spock/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 &&
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB_TRAFFIC} -h
          127.0.0.1"
      interval: 5s
      retries: 20
      timeout: 5s
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spock-silver-2:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_DB_TRAFFIC: ${POSTGRES_DB_TRAFFIC:-traffic}
      POSTGRES_USER: ${POSTGRES_SILVER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      PGEDGE_USER: ${PGEDGE_USER:-pgedge}
      PGEDGE_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
      NODE_NAME: silver2
      NODE_ORDINAL: "2"
    volumes:
      - spock-silver-2-data:/var/lib/pgsql
      - ./configs/spock/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 &&
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB_TRAFFIC} -h
          127.0.0.1"
      interval: 5s
      retries: 20
      timeout: 5s
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spock-gold-1:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_DB_TRAFFIC: ${POSTGRES_DB_TRAFFIC:-traffic}
      POSTGRES_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
      PGEDGE_USER: ${PGEDGE_USER:-pgedge}
      PGEDGE_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
      NODE_NAME: gold1
      NODE_ORDINAL: "1"
    volumes:
      - spock-gold-1-data:/var/lib/pgsql
      - ./configs/spock/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 &&
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB_TRAFFIC} -h
          127.0.0.1"
      interval: 5s
      retries: 20
      timeout: 5s
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spock-gold-2:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WMATA:-wmata}
      POSTGRES_DB_TRAFFIC: ${POSTGRES_DB_TRAFFIC:-traffic}
      POSTGRES_USER: ${POSTGRES_GOLD_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
      PGEDGE_USER: ${PGEDGE_USER:-pgedge}
      PGEDGE_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
      NODE_NAME: gold2
      NODE_ORDINAL: "2"
    volumes:
      - spock-gold-2-data:/var/lib/pgsql
      - ./configs/spock/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 &&
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB_TRAFFIC} -h
          127.0.0.1"
      interval: 5s
      retries: 20
      timeout: 5s
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spock-wire-silver:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: "no"
    entrypoint: ["/bin/bash", "/wire/run.sh"]
    environment:
      NODES: silver1:spock-silver-1,silver2:spock-silver-2
      DATABASES: "${POSTGRES_DB_WMATA:-wmata} ${POSTGRES_DB_TRAFFIC:-traffic}"
      ADMIN_USER: ${POSTGRES_SILVER_USER:-postgres}
      ADMIN_PASSWORD: ${POSTGRES_SILVER_PASSWORD:-postgres}
      REPL_USER: ${PGEDGE_USER:-pgedge}
      REPL_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
    volumes:
      - ./configs/spock/wire:/wire:ro
    depends_on:
      spock-silver-1:
        condition: service_healthy
      spock-silver-2:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  spock-wire-gold:
    <<: *default-logging
    image: ghcr.io/pgedge/pgedge-postgres:18.7-spock5.0.14-standard
    restart: "no"
    entrypoint: ["/bin/bash", "/wire/run.sh"]
    environment:
      NODES: gold1:spock-gold-1,gold2:spock-gold-2
      DATABASES: "${POSTGRES_DB_WMATA:-wmata} ${POSTGRES_DB_TRAFFIC:-traffic}"
      ADMIN_USER: ${POSTGRES_GOLD_USER:-postgres}
      ADMIN_PASSWORD: ${POSTGRES_GOLD_PASSWORD:-postgres}
      REPL_USER: ${PGEDGE_USER:-pgedge}
      REPL_PASSWORD: ${PGEDGE_PASSWORD:-pgedge}
    volumes:
      - ./configs/spock/wire:/wire:ro
    depends_on:
      spock-gold-1:
        condition: service_healthy
      spock-gold-2:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  # Single entry point for both clusters. Mode A routes writes to node 1 and
  # keeps node 2 as a hot backup; read-only ports round-robin both nodes.
  haproxy:
    <<: *default-logging
    image: docker.io/haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_SILVER_HOST_PORT:-5433}:5433
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_GOLD_HOST_PORT:-5434}:5434
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_SILVER_READ_HOST_PORT:-5435}:5435
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_GOLD_READ_HOST_PORT:-5436}:5436
      - ${HOST_IP:-127.0.0.1}:${HAPROXY_STATS_HOST_PORT:-8404}:8404
    volumes:
      - ./configs/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      spock-silver-1:
        condition: service_started
      spock-silver-2:
        condition: service_started
      spock-gold-1:
        condition: service_started
      spock-gold-2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  # Gate for one-shot clients: wait until HAProxy has a reachable backend.
  db-ready:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 90); do
          pg_isready -h haproxy -p 5433 -U ${POSTGRES_SILVER_USER:-postgres} >/dev/null 2>&1 && break
          sleep 2
        done
        pg_isready -h haproxy -p 5433 -U ${POSTGRES_SILVER_USER:-postgres} || exit 1
        for i in $(seq 1 90); do
          pg_isready -h haproxy -p 5434 -U ${POSTGRES_GOLD_USER:-postgres} >/dev/null 2>&1 && break
          sleep 2
        done
        pg_isready -h haproxy -p 5434 -U ${POSTGRES_GOLD_USER:-postgres} || exit 1
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  postgres-infra:
    <<: *default-logging
    image: docker.io/postgres:18.4-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_INFRA:-infra}
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
    volumes:
      - ./storage/postgres-infra:/var/lib/postgresql
      - ./configs/postgres/init-dbs-infra.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    env_file:
      - .env
    ports:
      - ${HOST_IP:-127.0.0.1}:${POSTGRES_INFRA_HOST_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_INFRA_USER:-postgres} -d
            ${POSTGRES_DB_INFRA:-infra}",
        ]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  seaweedfs:
    <<: *default-logging
    image: docker.io/chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - ${HOST_IP:-127.0.0.1}:8333:8333
      - ${HOST_IP:-127.0.0.1}:8888:8888
    volumes:
      - ./storage/seaweedfs:/data
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - ./configs/seaweedfs/notification.toml:/etc/seaweedfs/notification.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  seaweedfs-init:
    image: docker.io/chrislusf/seaweedfs:4.53
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://seaweedfs:9333/cluster/status >/dev/null 2>&1; do sleep 1; done
        sleep 5
        for bucket in wmata traffic mlflow; do
          echo "s3.bucket.create -name $${bucket} -owner $${bucket%}" \
            | /usr/bin/weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 || true
        done
        for bucket in wmata traffic mlflow; do
          if ! curl -sf "http://seaweedfs:8888/buckets/$${bucket}/" >/dev/null; then
            echo "ERROR: SeaweedFS bucket $${bucket} is missing" >&2
            exit 1
          fi
        done
        echo "SeaweedFS buckets ready"
    depends_on:
      seaweedfs:
        condition: service_started
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  seaweedfs-bridge:
    <<: *default-logging
    build:
      context: ./seaweedfs/bridge
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      BRIDGE_PORT: "8080"
    ports:
      - ${HOST_IP:-127.0.0.1}:8081:8080
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  victoriametrics:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:8428:8428
    environment:
      POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}

    volumes:
      - ./storage/victoriametrics:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION:-3M}"
      - "-httpListenAddr=:8428"
      - "-selfScrapeInterval=10s"
      - "-search.maxQueryDuration=30s"
      - "-memory.allowedPercent=60"
      - "-storage.minFreeDiskSpaceBytes=1GB"
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8428/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  victorialogs:
    <<: *default-logging
    image: docker.io/victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:9428:9428
    volumes:
      - ./storage/victorialogs:/vlogs
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${VL_RETENTION:-3M}"
    healthcheck:
      # The VictoriaLogs image is distroless (no shell, no wget).
      test: ["CMD", "/victoria-logs-prod", "-version"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  vector:
    <<: *default-logging
    image: docker.io/timberio/vector:0.60.0-alpine
    restart: unless-stopped
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      victorialogs:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  nats:
    <<: *default-logging
    image: docker.io/nats:2.15.2-alpine3.22
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:4222:4222
      - ${HOST_IP:-127.0.0.1}:8222:8222
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - ./storage/nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  nats-init:
    image: docker.io/natsio/nats-box:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for NATS..."
        until nc -z nats 4222; do sleep 1; done
        echo "Creating bronze/silver/inference streams..."
        create_stream() {
          name="$1"; subjects="$2"; max_age="$3"; max_bytes="$4"
          if nats -s nats:4222 stream info "$$name" >/dev/null 2>&1; then
            echo "stream $${name} already exists"
            return 0
          fi
          # `nats stream add` always asks for confirmation and fails without a
          # TTY, so talk to the JetStream API directly instead.
          payload="$$(printf '{"name":"%s","subjects":%s,"retention":"limits","max_msgs":-1,"max_bytes":%s,"max_age":%s,"storage":"file","discard":"old","duplicate_window":120000000000}' \
            "$$name" "$$subjects" "$$max_bytes" "$$max_age")"
          resp="$$(nats -s nats:4222 request '$$JS.API.STREAM.CREATE.'"$$name" "$$payload")"
          if printf '%s' "$$resp" | grep -q '"error"'; then
            echo "ERROR: failed to create stream $${name}: $$resp" >&2
            return 1
          fi
          echo "created stream $${name}"
        }
        create_stream wmata-bronze    '["wmata.realtime.bronze_data","wmata.realtime.bronze_data.>"]'     259200000000000 2147483648
        create_stream traffic-bronze  '["traffic.realtime.bronze_data","traffic.realtime.bronze_data.>"]' 259200000000000 2147483648
        create_stream wmata-silver    '["wmata.realtime.silver_data","wmata.realtime.silver_data.>"]'     604800000000000 5368709120
        create_stream traffic-silver  '["traffic.realtime.silver_data","traffic.realtime.silver_data.>"]' 604800000000000 5368709120
        create_stream wmata-inference '["wmata.realtime.inference","wmata.realtime.inference.>"]'         604800000000000 1073741824
        nats -s nats:4222 stream ls
        echo "NATS init complete"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  nats-nui:
    image: ghcr.io/nats-nui/nui:0.10
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:31311:31311
    volumes:
      - ./storage/nui:/db
      - ./configs/nui/contexts:/nui-contexts:ro
    command: ["--nats-cli-contexts=/nui-contexts"]
    depends_on:
      nats:
        condition: service_started
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  debezium-wmata:
    <<: *default-logging
    image: docker.io/debezium/server:3.0.0.Final
    restart: unless-stopped
    user: "0"
    env_file:
      - .env
    volumes:
      - ./configs/debezium/wmata.properties:/debezium/config/application.properties:ro
      - ./storage/debezium/wmata:/debezium/data
    depends_on:
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  debezium-traffic:
    <<: *default-logging
    image: docker.io/debezium/server:3.0.0.Final
    restart: unless-stopped
    user: "0"
    env_file:
      - .env
    volumes:
      - ./configs/debezium/traffic.properties:/debezium/config/application.properties:ro
      - ./storage/debezium/traffic:/debezium/data
    depends_on:
      db-ready:
        condition: service_completed_successfully
      spock-wire-silver:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  dagster-user-code:
    <<: *default-logging
    build:
      context: .
      dockerfile: dagster/etl/Containerfile
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DLT_PROJECT_DIR: /opt/dagster/dlt
      WMATA_NETWORK: wmata-lateness_wmata-lateness-dev
      SPARK_GOLD_IMAGE: wmata-spark-gold:latest
      ML_IMAGE: wmata-ml:latest
      DLT_IMAGE: wmata-lateness-dlt:latest
      DLT_STATE_VOLUME: wmata-lateness_dlt-state
      DLT_START_DATE: "2020-01-06"
      DLT_END_DATE: "2020-02-08"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${SEAWEEDFS_S3_ENDPOINT:-http://seaweedfs:8333}
      QUALITY_REPORT_DIR: /opt/dagster/app/quality/reports
      PARQUET_RETENTION_VERSIONS: "7"
    env_file:
      - .env
    volumes:
      - ./dagster:/opt/dagster/app
      - ./dlt:/opt/dagster/dlt
      - ./dbt:/opt/dagster/dbt
      - ./gx_quality:/opt/dagster/app/gx_quality
      - ./quality:/opt/dagster/app/quality
      - ./governance:/opt/dagster/app/governance:ro
      - ./tests:/opt/dagster/app/tests:ro
      - ./.git:/opt/dagster/app/.git:ro
      - ./shared:/opt/dagster/app/shared:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres-infra:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(5);
            s.connect(('127.0.0.1',4000)); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  dagster-webserver:
    <<: *default-logging
    build:
      context: .
      dockerfile: ./dagster/daemon/Containerfile
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:3000:3000
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
            urllib.request.urlopen('http://localhost:3000/dagit_info')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  dagster-daemon:
    <<: *default-logging
    build:
      context: .
      dockerfile: ./dagster/daemon/Containerfile
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_INFRA_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_INFRA_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: dagster_db
      DAGSTER_POSTGRES_HOST: postgres-infra
      DAGSTER_POSTGRES_PORT: ${POSTGRES_INFRA_PORT:-5432}
    entrypoint:
      - dagster-daemon
      - run
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; c=open('/proc/1/cmdline').read(); exit(0 if
            'dagster-daemon' in c else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      dagster-user-code:
        condition: service_healthy
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

  mlflow:
    <<: *default-logging
    build:
      context: .
      dockerfile: configs/mlflow/Containerfile
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:${MLFLOW_HOST_PORT:-5000}:5000
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_INFRA_USER:-postgres}:${POSTGRES_INFRA_PASSWORD:-postgres}@postgres-infra:${POSTGRES_INFRA_PORT:-5432}/mlflow_db
      MLFLOW_S3_ENDPOINT_URL: ${SEAWEEDFS_S3_ENDPOINT:-http://seaweedfs:8333}
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MLFLOW_KEY_ID:-mlflow-key-id}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_SECRET_KEY:-mlflow-secret-key}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      MLFLOW_ALLOWED_HOSTS: "*"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; assert
            urllib.request.urlopen('http://localhost:5000/health').status ==
            200",
        ]
      interval: 30s
      timeout: 10s
      retries: 3000
      start_period: 30s
    depends_on:
      postgres-infra:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    networks:
      - wmata-lateness-dev
    profiles: ["dev"]

